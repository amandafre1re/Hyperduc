<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Novo Projeto</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container mt-5">
    <h2 class="mb-4">Criar Novo Projeto</h2>
    
    <div id="alerta"></div>
    
    <div class="mb-3">
      <label for="nm_projeto" class="form-label">Nome do Projeto</label>
      <input type="text" class="form-control" id="nm_projeto" required>
    </div>

    <div class="mb-3">
      <label for="desc_projeto" class="form-label">Descrição</label>
      <textarea class="form-control" id="desc_projeto" rows="5" required></textarea>
    </div>

    <button id="btnSalvarProjeto" class="btn btn-primary">Salvar Projeto</button>
  </div>

  <script src="../assets/js/projeto/novo_projeto.js"></script>
</body>
</html>
