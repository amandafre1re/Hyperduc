<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Editar Projeto</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container mt-5">
    <h2 class="mb-4">Editar Projeto</h2>
    <div id="alerta"></div>
    <form id="formEditarProjeto">
      <div class="mb-3">
        <label for="nm_projeto" class="form-label">Nome do Projeto</label>
        <input type="text" class="form-control" id="nm_projeto" name="nm_projeto" required>
      </div>
      <div class="mb-3">
        <label for="desc_projeto" class="form-label">Descrição</label>
        <textarea class="form-control" id="desc_projeto" name="desc_projeto" rows="5" required></textarea>
      </div>
      <button type="submit" class="btn btn-primary">Salvar Alterações</button>
      <button type="button" id="btnExcluirProjeto" class="btn btn-danger ms-2">Excluir Projeto</button>
    </form>
  </div>
  <script src="../assets/js/projeto/altera_projeto.js"></script>
  <script src="../assets/js/projeto/apaga_projeto.js"></script>
</body>
</html>
