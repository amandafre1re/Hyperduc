<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Perfil do Usuário</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <div class="container mt-5">
    <div class="card shadow">
      <div class="card-header bg-primary text-white">
        <h4 class="mb-0">Meu Perfil</h4>
      </div>
      <div class="card-body">
        <div id="alerta" class="mb-3"></div>

        <form id="formPerfil">
          <div class="row mb-3">
            <div class="col-md-6">
              <label for="nome_usuario" class="form-label">Nome completo</label>
              <input type="text" id="nome_usuario" class="form-control" placeholder="Digite seu nome">
            </div>
            <div class="col-md-6">
              <label for="email_usuario" class="form-label">E-mail</label>
              <input type="email" id="email_usuario" class="form-control" placeholder="Seu e-mail" disabled>
            </div>
          </div>

          <div class="row mb-3">
            <div class="col-md-4">
              <label for="cidade" class="form-label">Cidade</label>
              <input type="text" id="cidade" class="form-control" placeholder="Sua cidade">
            </div>
<div class="col-md-4">
  <label for="uf" class="form-label">UF</label>
        <select id="uf" name="uf" class="form-select" required>
          <option selected hidden>Escolha...</option>
          <option value="AC">AC</option>
          <option value="AL">AL</option>
          <option value="AP">AP</option>
          <option value="AM">AM</option>
          <option value="BA">BA</option>
          <option value="CE">CE</option>
          <option value="DF">DF</option>
          <option value="ES">ES</option>
          <option value="GO">GO</option>
          <option value="MA">MA</option>
          <option value="MT">MT</option>
          <option value="MS">MS</option>
          <option value="MG">MG</option>
          <option value="PA">PA</option>
          <option value="PB">PB</option>
          <option value="PR">PR</option>
          <option value="PE">PE</option>
          <option value="PI">PI</option>
          <option value="RJ">RJ</option>
          <option value="RN">RN</option>
          <option value="RS">RS</option>
          <option value="RO">RO</option>
          <option value="RR">RR</option>
          <option value="SC">SC</option>
          <option value="SP">SP</option>
          <option value="SE">SE</option>
          <option value="TO">TO</option>
        </select>
</div>

            <div class="col-md-4">
              <label for="pais" class="form-label">País</label>
              <input type="text" id="pais" class="form-control" placeholder="Brasil">
            </div>
          </div>

          <div class="d-grid gap-2 d-md-flex justify-content-md-end">
            <button type="button" id="btnAtualizarPerfil" class="btn btn-success">Salvar Alterações</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="../assets/js/usuario/usuario_ler.js"></script>
  <script src="../assets/js/usuario/usuario_update.js"></script>
</body>
</html>
