<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Perfil do Usuário</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container mt-5">
    <h2>Meu Perfil</h2>
    <form id="formPerfil">
      <div class="mb-3">
        <label for="nome_usuario" class="form-label">Nome</label>
        <input type="text" class="form-control" id="nome_usuario" name="nome_usuario" required>
      </div>

      <div class="mb-3">
        <label for="email_usuario" class="form-label">Email</label>
        <input type="email" class="form-control" id="email_usuario" name="email_usuario" required>
      </div>

      <div class="mb-3">
        <label for="cidade" class="form-label">Cidade</label>
        <input type="text" class="form-control" id="cidade" name="cidade">
      </div>

      <div class="mb-3">
        <label for="uf" class="form-label">UF</label>
        <input type="text" class="form-control" id="uf" name="uf">
      </div>

      <div class="mb-3">
        <label for="pais" class="form-label">País</label>
        <input type="text" class="form-control" id="pais" name="pais">
      </div>

      <button type="button" class="btn btn-primary" id="btnAtualizarPerfil">Atualizar</button>
    </form>
    <div id="alerta" class="mt-3"></div>
  </div>

  <script src="../assets/js/usuario/usuario_ler.js"></script>
  <script src="../assets/js/usuario/usuario_update.js"></script>
</body>
</html>
