<!DOCTYPE html>
<html lang="en">
<head>
  <title>Cadastro</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>

<div class="container mt-3">
  <h2>Cadastro de usuário</h2>
<div class="container mt-5">
  <form>
    <div class="row mb-3">
      <div class="col-md-4">
        <label for="nome_usuario" class="form-label">Nome de Usuário</label>
        <input type="text" class="form-control" id="nome_usuario" name="nome_usuario" required>
      </div>
      <div class="col-md-4">
        <label for="email_usuario" class="form-label">Email</label>
        <input type="email" class="form-control" id="email_usuario" name="email_usuario" required>
      </div>
      <div class="col-md-4">
        <label for="senha_usuario" class="form-label">Senha</label>
        <input type="password" class="form-control" id="senha_usuario" name="senha_usuario" required>
      </div>
    </div>

    <div class="row mb-3">
      <div class="col-md-4">
        <label for="data_nasc" class="form-label">Data de Nascimento</label>
        <input type="date" class="form-control" id="data_nasc" name="data_nasc" required>
      </div>
      <div class="col-md-4">
        <label for="cidade" class="form-label">Cidade</label>
        <input type="text" class="form-control" id="cidade" name="cidade" required>
      </div>
      <div class="col-md-2">
        <label for="uf" class="form-label">UF</label>
        <select id="uf" name="uf" class="form-select" required>
          <option selected hidden>Escolha...</option>
          <option value="AC">AC</option>
          <option value="AL">AL</option>
          <option value="AP">AP</option>
          <option value="AM">AM</option>
          <option value="BA">BA</option>
          <option value="CE">CE</option>
          <option value="DF">DF</option>
          <option value="ES">ES</option>
          <option value="GO">GO</option>
          <option value="MA">MA</option>
          <option value="MT">MT</option>
          <option value="MS">MS</option>
          <option value="MG">MG</option>
          <option value="PA">PA</option>
          <option value="PB">PB</option>
          <option value="PR">PR</option>
          <option value="PE">PE</option>
          <option value="PI">PI</option>
          <option value="RJ">RJ</option>
          <option value="RN">RN</option>
          <option value="RS">RS</option>
          <option value="RO">RO</option>
          <option value="RR">RR</option>
          <option value="SC">SC</option>
          <option value="SP">SP</option>
          <option value="SE">SE</option>
          <option value="TO">TO</option>
        </select>
      </div>
      <div class="col-md-2">
        <label for="pais" class="form-label">País</label>
        <input type="text" class="form-control" id="pais" name="pais" value="Brasil" required>
      </div>
    </div>



  </form>
  <button type="button" id="btnNovoUsuario" class="btn btn-primary">Submit</button>
  <div id="alerta"></div>

</div>
<script src="../assets/js/usuario/usuario_novo.js"></script>
</body>
</html>
